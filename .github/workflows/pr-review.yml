name: pr-review
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  data-review:
    uses: linz/topographic-system/.github/workflows/data-review.yml@feat/visual-diff-with-data
    with:
      environment: nonprod
      changed_datasets_only: false
      output: s3://linz-topography-nonprod/
      strategy: ${{ (github.ref == 'refs/heads/master' && github.event_name == 'push') && 'latest,date' || format('commit={0}', github.sha) }}
    secrets: inherit

  visual-diff:
    needs: data-review    
    uses: linz/topographic-system/.github/workflows/visual-diff.yml@feat/visual-diff-with-data
    with:
      environment: nonprod
      map_version: pr-138
      project: s3://linz-topography-nonprod/qgis/nztopo50/latest/nztopo50.json
      data: tmp/kart/prepare/
    secrets: inherit
